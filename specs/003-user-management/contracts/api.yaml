openapi: 3.0.3
info:
  title: POS User Management API
  description: API for user authentication, roles, and shift management
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

paths:
  /auth/login:
    post:
      summary: Authenticate user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, pin, terminal_id]
              properties:
                username:
                  type: string
                  example: "cashier01"
                pin:
                  type: string
                  example: "1234"
                terminal_id:
                  type: string
                  example: "POS-001"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Logout user
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id]
              properties:
                terminal_id:
                  type: string
      responses:
        '200':
          description: Logout successful
        '400':
          description: Open shift exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-pin:
    post:
      summary: Verify PIN for sensitive actions
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, pin]
              properties:
                user_id:
                  type: string
                  format: uuid
                pin:
                  type: string
      responses:
        '200':
          description: PIN valid
        '401':
          description: Invalid PIN

  /users:
    get:
      summary: List users
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

    post:
      summary: Create user
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /users/{id}:
    get:
      summary: Get user details
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    put:
      summary: Update user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}/deactivate:
    post:
      summary: Deactivate user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated
        '400':
          description: Cannot deactivate (e.g., only admin)

  /users/{id}/reactivate:
    post:
      summary: Reactivate user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User reactivated

  /roles:
    get:
      summary: List roles
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

  /permissions:
    get:
      summary: List all permissions
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'

  /shifts:
    post:
      summary: Start shift
      tags: [Shifts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartShiftRequest'
      responses:
        '201':
          description: Shift started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          description: Shift already open

  /shifts/current:
    get:
      summary: Get current open shift
      tags: [Shifts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '404':
          description: No open shift

  /shifts/{id}/close:
    post:
      summary: Close shift
      tags: [Shifts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseShiftRequest'
      responses:
        '200':
          description: Shift closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'

  /shifts/{id}/force-close:
    post:
      summary: Force close another user's shift (supervisor only)
      tags: [Shifts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, supervisor_pin]
              properties:
                reason:
                  type: string
                supervisor_pin:
                  type: string
      responses:
        '200':
          description: Shift force closed
        '403':
          description: Not authorized

  /sync/users:
    get:
      summary: Get user data for terminal sync
      tags: [Sync]
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          description: ISO timestamp of last sync
          schema:
            type: string
            format: date-time
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User sync data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSyncResponse'

  /sync/shifts:
    post:
      summary: Upload shift and auth log data from terminal
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftSyncRequest'
      responses:
        '200':
          description: Sync successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced_shifts:
                    type: integer
                  synced_auth_logs:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        branch_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, pin, first_name, last_name, branch_id, role_ids]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        pin:
          type: string
          pattern: '^\d{4,6}$'
        password:
          type: string
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        branch_id:
          type: string
          format: uuid
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          nullable: true
        pin:
          type: string
          pattern: '^\d{4,6}$'
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        is_default:
          type: boolean
        permissions:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string

    Shift:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        terminal_id:
          type: string
        branch_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        opening_cash:
          type: number
        closing_cash:
          type: number
          nullable: true
        expected_cash:
          type: number
          nullable: true
        variance:
          type: number
          nullable: true
        variance_reason:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, closed, force_closed]

    StartShiftRequest:
      type: object
      required: [terminal_id, opening_cash]
      properties:
        terminal_id:
          type: string
        opening_cash:
          type: number

    CloseShiftRequest:
      type: object
      required: [closing_cash]
      properties:
        closing_cash:
          type: number
        variance_reason:
          type: string
          nullable: true

    UserSyncResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
              pin_hash:
                type: string
              first_name:
                type: string
              last_name:
                type: string
              branch_id:
                type: string
              is_active:
                type: boolean
              roles:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    code:
                      type: string
                    permissions:
                      type: array
                      items:
                        type: string
              updated_at:
                type: string
        deleted_user_ids:
          type: array
          items:
            type: string
        sync_timestamp:
          type: string
          format: date-time

    ShiftSyncRequest:
      type: object
      required: [terminal_id, shifts, auth_logs]
      properties:
        terminal_id:
          type: string
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/Shift'
        auth_logs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              user_id:
                type: string
                nullable: true
              username:
                type: string
              event_type:
                type: string
              failure_reason:
                type: string
                nullable: true
              created_at:
                type: string

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
